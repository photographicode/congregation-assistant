name: Canonical Pages deployment
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      verify_custom_domain:
        type: boolean
        default: false
        description: Verify the configured custom domain
permissions:
  contents: read
concurrency:
  group: canonical-pages
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  ci:
    uses: ./.github/workflows/ci.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  pdf:
    uses: ./.github/workflows/pdf.yml
  build:
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.security.result == 'success' && needs.e2e.result == 'success'
      && needs.pdf.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 151396149ad8942ecd331230eb86d1395c3d4f1b
        path: work/rollback-source
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Reconstruct previous verified source for rollback
      working-directory: work/rollback-source
      run: 'npm ci --ignore-scripts

        node scripts/build-pages.mjs'
      env:
        GITHUB_SHA: 151396149ad8942ecd331230eb86d1395c3d4f1b
        CA_PAGES_URL: https://photographicode.github.io/congregation-assistant
        CUSTOM_DOMAIN_READY: 'false'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rollback-pages-1513961
        path: work/rollback-source/work/pages
        include-hidden-files: true
        retention-days: 30
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: current-ui-evidence
        path: work/current-ui-evidence
    - name: Use evidence from this workflow run
      run: 'cp work/current-ui-evidence/final-dialog-layers.json docs/qa/final-dialog-layers.json

        cp work/current-ui-evidence/interaction-audit.json docs/qa/interaction-audit.json

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-pdf-evidence
        path: work/current-pdf-evidence
    - name: Use PDF evidence from this workflow run
      run: 'cp work/current-pdf-evidence/docs/qa/r1-pdf-geometry.json docs/qa/r1-pdf-geometry.json

        cp work/current-pdf-evidence/docs/qa/s21-measured-hardening.json docs/qa/s21-measured-hardening.json

        cp work/current-pdf-evidence/docs/qa/s21-hardening-geometry.json docs/qa/s21-hardening-geometry.json

        '
    - run: node scripts/check-final-release.mjs
    - run: node scripts/build-pages.mjs
      env:
        CA_PAGES_URL: ${{ vars.CUSTOM_DOMAIN_READY == 'true' && (vars.SITE_URL || 'https://congregationassistant.com') || 'https://photographicode.github.io/congregation-assistant'
          }}
        CUSTOM_DOMAIN_READY: ${{ vars.CUSTOM_DOMAIN_READY || 'false' }}
        SITE_URL: ${{ vars.SITE_URL || '' }}
        APP_URL: ${{ vars.APP_URL || '' }}
    - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: work/pages
        retention-days: 30
    needs:
    - ci
    - security
    - e2e
    - pdf
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    if: always() && !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET != 'cloudflare'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      with:
        enablement: true
    - name: Use Actions as the Pages publishing source
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: "try {\n  await github.rest.repos.updateInformationAboutPagesSite({\n    ...context.repo,\n    build_type: 'workflow'\n  });\n  core.info('Pages uses\
          \ Actions; branch publishing is disabled.');\n} catch (error) {\n  if (error.status !== 403) throw error;\n  core.warning('This token cannot change the\
          \ Pages publishing source. Select GitHub Actions in repository Pages settings to avoid competing branch builds.');\n}\n"
    - name: Wait for competing branch publisher before canonical deployment
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: "for (let attempt = 0; attempt < 40; attempt++) {\n  const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha:\
          \ context.sha, per_page: 100});\n  const competing = data.workflow_runs.filter(run => run.name === 'pages build and deployment' && run.status !== 'completed');\n\
          \  if (!competing.length) { core.info('No competing branch publisher remains active.'); return; }\n  core.info('Waiting for the branch publisher to finish\
          \ before deploying the canonical artifact.');\n  await new Promise(resolve => setTimeout(resolve, 15000));\n}\nthrow new Error('Competing branch publisher\
          \ still active; preserve the currently verified deployment.');"
    - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      id: deployment
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - run: npm ci --ignore-scripts
    - run: npx playwright install --with-deps chromium
    - name: Verify published site app worker and on-device demo
      run: node scripts/check-pages-deploy.cjs
      env:
        CA_LIVE_URL: https://photographicode.github.io/congregation-assistant/
        CA_EXPECTED_COMMIT: ${{ github.sha }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: github-pages
        path: work/deployed-artifact
    - name: Extract approved Pages artifact
      run: 'mkdir -p work/live-expected

        tar -xf work/deployed-artifact/artifact.tar -C work/live-expected'
    - name: Compare every published file and audit the live bytes
      run: 'node scripts/check-live-artifact.mjs

        node scripts/check-published-files.mjs work/live-published

        node scripts/site-audit.mjs'
      env:
        CA_LIVE_URL: https://photographicode.github.io/congregation-assistant/
        CA_EXPECTED_COMMIT: ${{ github.sha }}
        SITE_AUDIT_ROOT: work/live-published
        SITE_AUDIT_URL: https://photographicode.github.io/congregation-assistant/
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: post-deploy-evidence
        path: 'work/quality/live-artifact.json

          work/quality/site-audit.json'
        retention-days: 30
    timeout-minutes: 25
  verify-custom-domain-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: node scripts/verify-production.mjs
      env:
        EXPECTED_COMMIT: ${{ inputs.commit }}
    if: github.event_name == 'workflow_dispatch' && inputs.verify_custom_domain
  cloudflare:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Check optional Cloudflare configuration
      id: configuration
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CA_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      run: "if [ -z \"$CLOUDFLARE_API_TOKEN\" ] || [ -z \"$CLOUDFLARE_ACCOUNT_ID\" ] || [ -z \"$CA_PAGES_PROJECT\" ]; then\n  echo 'enabled=false' >> \"$GITHUB_OUTPUT\"\
        \n  echo 'Cloudflare Pages is not configured; current hosting stays active.'\nelse\n  echo 'enabled=true' >> \"$GITHUB_OUTPUT\"\nfi\n"
    - if: steps.configuration.outputs.enabled == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - if: steps.configuration.outputs.enabled == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - if: steps.configuration.outputs.enabled == 'true'
      run: npm ci --ignore-scripts
    - if: steps.configuration.outputs.enabled == 'true'
      run: npm run check:release && npm run check && npm test && npm run build
    - name: Deploy only when configured
      if: steps.configuration.outputs.enabled == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CA_SITE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_SITE_PROJECT_NAME }}
        CA_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      run: "if [ -z \"$CLOUDFLARE_API_TOKEN\" ] || [ -z \"$CLOUDFLARE_ACCOUNT_ID\" ] || [ -z \"$CA_PAGES_PROJECT\" ]; then\n  echo 'Cloudflare Pages not set up; existing\
        \ hosting remains in use.'\n  exit 0\nfi\nnpx --no-install wrangler pages deploy dist --project-name \"$CA_PAGES_PROJECT\"\nif [ -n \"$CA_SITE_PAGES_PROJECT\"\
        \ ]; then\n  npx --no-install wrangler pages deploy dist-site --project-name \"$CA_SITE_PAGES_PROJECT\"\nfi\n"
    needs:
    - ci
    - security
    - e2e
    - pdf
