name: Optional Cloudflare Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check optional Cloudflare configuration
        id: configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CA_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CA_PAGES_PROJECT" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare Pages is not configured; current hosting stays active.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configuration.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.configuration.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm ci --ignore-scripts
      - if: steps.configuration.outputs.enabled == 'true'
        run: npm run check:release && npm run check && npm test && npm run build
      - name: Deploy only when configured
        if: steps.configuration.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CA_SITE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_SITE_PROJECT_NAME }}
          CA_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CA_PAGES_PROJECT" ]; then
            echo 'Cloudflare Pages not set up; existing hosting remains in use.'
            exit 0
          fi
          npx --yes wrangler@4.45.0 pages deploy dist --project-name "$CA_PAGES_PROJECT"
          if [ -n "$CA_SITE_PAGES_PROJECT" ]; then
            npx --yes wrangler@4.45.0 pages deploy dist-site --project-name "$CA_SITE_PAGES_PROJECT"
          fi
