name: R1 report matrix (explicit refresh)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refinement:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        fontMode: [css, browser-default]
    env:
      CA_REFINEMENT_SCREENS: reports,report-entry,bulk,report-discard,report-saved,AP-confirm,ap-error,ap-pending
      CA_REFINEMENT_HARD_ONLY: 'true'
      CA_REFINEMENT_FONT_MODE: ${{ matrix.fontMode }}
      CA_REFINEMENT_SCALES: ${{ matrix.fontMode == 'browser-default' && '1,1.25,1.5,2' || '1,1.3,2' }}
      CA_REFINEMENT_LANDSCAPE: 'true'
      CA_REFINEMENT_SHARD: ${{ matrix.shard }}
      CA_REFINEMENT_REPORT: docs/qa/refinement-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-r1-full-matrix.mjs
      - run: node scripts/refinement-matrix.ts
      - run: node scripts/refinement-matrix.ts
        env:
          CA_REFINEMENT_SCREENS: publisher-entry,group-entry
          CA_REFINEMENT_REPORT: docs/qa/refinement-role-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-geometry-${{ matrix.fontMode }}-${{ matrix.shard }}
          path: docs/qa/refinement-*matrix*.json
