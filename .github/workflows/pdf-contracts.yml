name: Native PDF golden and script contracts
on:
  pull_request:
    paths: ['packages/pdf/**', 'apps/web/src/features/PdfStudio.tsx', 'assets/fonts/**', 'assets/pdf-templates/**', 'tests/**', 'scripts/*pdf*', 'package*.json', '.github/workflows/pdf-contracts.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 0'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil python3-numpy
      - run: node scripts/generate-v2-pdf-fixtures.mjs
      - run: python3 scripts/check-pdf-parity.py
      - run: node scripts/check-pdf-contract.mjs
      - run: node scripts/check-unicode-native-pdf.mjs
      - run: node scripts/check-schedule-pdf.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-pdf-browser.cjs
      - run: node scripts/build-trust-metrics.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-pdf-evidence
          path: |
            docs/review-evidence/pdf-*.json
            work/pdf-v2/
            work/pdf-unicode/
          retention-days: 14
