name: V3 themes and components
on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'assets/fonts/**', 'tests/v3/**', 'scripts/*v3*', 'scripts/contrast-check.mjs', 'package*.json', 'eslint.config.mjs', '.github/workflows/v3-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v3:ui
      - run: npm run test:v3:themes
      - run: npm run test:v3:shell
      - run: npm run test:v3:store
      - run: npm run test:v3:offline
      - name: Strict supplied-theme gradient contrast gate
        run: npm run check:contrast
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-theme-evidence
          path: docs/qa/
          retention-days: 14
