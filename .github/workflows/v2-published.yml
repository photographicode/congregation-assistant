name: Published V2 verification
on:
  workflow_run:
    workflows: ['V2 root deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          BASE_URL: ${{ vars.APP_BASE_URL || '/congregation-assistant/' }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-cutover-published.cjs
        env:
          CA_V2_BASE_URL: ${{ vars.APP_URL || 'https://photographicode.github.io/congregation-assistant/' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-v2-results
          path: artifacts/v2/
