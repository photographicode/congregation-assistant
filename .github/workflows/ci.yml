name: CI
'on':
  push:
    branches:
    - v3/resume
    - v3/quality
    - v3/launch-hardening
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run check && node scripts/check-public-safety.cjs && node scripts/check-no-legacy.mjs
    - run: npm run check:vercel-guidelines
    - run: node --test scripts/meetings/parse.test.mjs
    - run: npm run build && npm run check:bundle && npm run check:size
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: ca_acceptance
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - run: psql -h localhost -U postgres -d ca_acceptance -f scripts/check-supabase.sql
      env:
        PGPASSWORD: acceptance-only
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - run: node scripts/check-rpc-role-matrix.mjs
      env:
        PGPASSWORD: acceptance-only
    - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d ca_acceptance -f scripts/check-no-password-columns.sql
      env:
        PGPASSWORD: acceptance-only
    - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d ca_acceptance -f scripts/check-rls.sql
      env:
        PGPASSWORD: acceptance-only
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: rpc-role-matrix
        path: work/quality/rpc-role-matrix.json
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check:
        - strict-types
        - style
        - css
        - architecture
        - cycles
        - unused
        - duplication
        - lint-ratchet
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run check:${{ matrix.check }}
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run test:coverage
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: coverage-evidence
        path: work/quality/coverage
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npx playwright install --with-deps chromium
      timeout-minutes: 6
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
    - run: node scripts/build-pages.mjs
    - run: node scripts/site-audit-browser.mjs
      env:
        SITE_AUDIT_ROOT: work/pages
        SITE_AUDIT_URL: https://photographicode.github.io/congregation-assistant/
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: site-audit
        path: work/quality/site-*.json
