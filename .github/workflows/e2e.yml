name: Browser and layout gates
'on':
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
  - cron: 15 3 * * 0
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npx playwright install --with-deps chromium firefox webkit
    - run: sudo apt-get update && sudo apt-get install -y poppler-utils
    - run: npm run build
    - run: node scripts/check-v3-resume.cjs
    - run: node scripts/check-admin-assistant.cjs
    - run: node scripts/check-dialog-layers.cjs
    - run: node scripts/check-refinement.cjs
    - run: node scripts/check-ap-refinement.cjs
    - run: node scripts/overlay-audit.ts
    - run: node scripts/check-short-navigation.cjs
    - run: node scripts/check-direct-downloads.cjs
    - run: node scripts/check-home-next.cjs
    - run: node scripts/check-weekend-next.cjs
    - run: node scripts/check-install-next.cjs
    - run: node scripts/check-theme-fonts.cjs
    - run: node scripts/check-wol-app.cjs
    - run: node scripts/check-marketing-site.cjs
    - run: node scripts/check-v3-ui.mjs
    - run: node scripts/check-v3-shell.cjs
    - run: node scripts/check-v3-store-browser.mjs
    - run: node scripts/check-v3-offline-app.cjs
    - run: node scripts/check-rendered-contrast.mjs
    - run: node scripts/check-claims.mjs
    - run: node scripts/interaction-audit.ts
    - run: npm run check:vercel-guidelines
    - run: npx vitest run tests/hell
    - run: node scripts/hell-browser-smoke.cjs
    - run: node scripts/refinement-matrix.ts
      env:
        CA_REFINEMENT_WIDTHS: 320,390,768,1024,1440
        CA_REFINEMENT_SCALES: 1,2
        CA_REFINEMENT_THEMES: mono-light,lagoon-glass,aurora
        CA_REFINEMENT_SCREENS: home,people,reports,schedule,settings,assistant
        CA_REFINEMENT_HARD_ONLY: 'true'
  full:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        fontMode:
        - css
        - browser-default
    env:
      CA_REFINEMENT_HARD_ONLY: 'true'
      CA_REFINEMENT_FONT_MODE: ${{ matrix.fontMode }}
      CA_REFINEMENT_SCALES: ${{ matrix.fontMode == 'browser-default' && '1,1.25,1.5,2' || '1,1.3,2' }}
      CA_REFINEMENT_LANDSCAPE: 'true'
      CA_REFINEMENT_SHARD: ${{ matrix.shard }}
      CA_REFINEMENT_REPORT: docs/qa/refinement-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npx playwright install --with-deps chromium
    - run: npm run build
    - run: node scripts/refinement-matrix.ts
    - run: node scripts/refinement-matrix.ts
      env:
        CA_REFINEMENT_SCREENS: publisher-entry,group-entry,public-entry,public-error,public-pending,owner-editor,owner-request,public-schedule,public-schedule-aux
        CA_REFINEMENT_REPORT: docs/qa/refinement-role-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: refinement-geometry-${{ matrix.fontMode }}-${{ matrix.shard }}
        path: docs/qa/refinement-*matrix*.json
