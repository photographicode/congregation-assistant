name: Private-repository OSS security scans
on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'supabase/**', 'scripts/**', '.semgrep/**', '.gitleaks.toml', 'package*.json', '.github/workflows/security-scans.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * 0'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/security-requirements.txt
      - run: pip install -r .github/security-requirements.txt
      - run: mkdir -p work/security && semgrep scan --config .semgrep/security.yml --error --json --output work/security/semgrep.json apps/web/src apps/site packages/ui
      - name: Gitleaks OSS (no paid private-repository action)
        run: |
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o work/security/gitleaks.tar.gz
          tar -xzf work/security/gitleaks.tar.gz -C work/security gitleaks
          work/security/gitleaks git --config .gitleaks.toml --redact --report-format json --report-path work/security/gitleaks.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oss-security-evidence
          path: work/security/*.json
          retention-days: 14
