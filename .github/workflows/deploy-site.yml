name: Deploy site on Cloudflare Workers
on:
  push:
    branches: [main]
  pull_request:
    paths: ['apps/**', 'packages/**', 'assets/**', 'hosting/**', 'scripts/**', '*config*', 'package*.json', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: cloudflare-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build && npm run check:bundle
        env:
          BASE_URL: /
      - name: Publish or explicitly skip missing credentials
        id: deploy
        run: node scripts/deploy-cloudflare.mjs site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Link the preview
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Cloudflare site preview: ' + process.env.PREVIEW_URL + '\nThe source repository can remain private.'});
