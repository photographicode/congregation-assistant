name: V2 foundation acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:v2
      - run: npm test
      - run: npm run build:v2
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v2:browser
      - run: node scripts/check-dashboard-browser.cjs
      - run: |
          node scripts/serve-cutover.cjs > /tmp/ca-preview.log 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null
      - run: node scripts/check-experience-browser.cjs
      - run: node scripts/check-reachability.cjs
      - run: node scripts/check-report-browser.cjs
      - run: node scripts/check-owner-browser.cjs
      - run: node scripts/check-site-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-build-and-verification
          path: |
            dist/
            artifacts/v2/
            docs/REQUIREMENTS.md
            docs/V2-MASTER-README.md
            docs/v2-release-checklist.md
            docs/DB-ROLLOUT.md
          retention-days: 14
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: ca_v2_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Baseline SQL contracts and V2 migrations
        env:
          PGPASSWORD: acceptance-only
        run: |
          psql -h localhost -U postgres -d ca_v2_acceptance -f scripts/check-supabase.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -c 'create schema if not exists extensions; create extension if not exists pgcrypto with schema extensions;'
          for migration_file in supabase/migrations/*.sql; do
            case "$migration_file" in *.down.sql|*drop_legacy_auth.sql) continue;; esac
            psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -1 -f "$migration_file"
          done
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-experience.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-mail-links.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-v2-plan.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-v2-records-export.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-own-sessions.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-extended-person.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-v2-contract.sql
          psql -h localhost -U postgres -d ca_v2_acceptance -v ON_ERROR_STOP=1 -f scripts/check-cutover-auth.sql
