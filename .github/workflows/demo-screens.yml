name: Capture demo screens
on:
  push:
    paths:
      - scripts/capture-demo.cjs
      - .github/workflows/demo-screens.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-demo.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: actual-demo-screens
          path: artifacts/demo-screens/
          retention-days: 14
