name: Security contracts and supply chain
'on':
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
  push: {}
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: Install checksum-verified Gitleaks
      run: |
        mkdir -p work/security
        curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o work/security/gitleaks.tar.gz
        echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  work/security/gitleaks.tar.gz' | sha256sum --check
        tar -xzf work/security/gitleaks.tar.gz -C work/security gitleaks
        work/security/gitleaks git --log-opts="--all" --config .gitleaks.toml --redact --report-format json --report-path work/security/gitleaks.json .
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Scan full history with TruffleHog
      run: |
        curl --fail --location --retry 2 https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.12/trufflehog_3.90.12_linux_amd64.tar.gz -o work/security/trufflehog.tar.gz
        echo '318fd1e8af68b54f4465437208582003a5948293ea401c5c67bb55f17e4e2102  work/security/trufflehog.tar.gz' | sha256sum --check
        tar -xzf work/security/trufflehog.tar.gz -C work/security trufflehog
        node scripts/scan-history.mjs work/security/trufflehog
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: secret-scan
        path: |
          work/security/gitleaks.json
          work/security/trufflehog-summary.json
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: pip install -r .github/security-requirements.txt
    - name: Semgrep OSS security and application rules
      run: |
        mkdir -p work/security
        semgrep scan --metrics=off --config p/typescript --config p/react --config p/security-audit --config p/owasp-top-ten --sarif --output work/security/semgrep.sarif --error apps/web/src packages/core packages/ui packages/pdf
    - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      if: always()
      with:
        sarif_file: work/security/semgrep.sarif
  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      with:
        languages: javascript-typescript
    - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm audit --omit=dev --audit-level=high
    - run: mkdir -p work/security && npx cyclonedx-npm --package-lock-only --omit dev --output-file work/security/sbom.json
    - run: node scripts/check-osv-reviews.mjs
    - name: OSV source lockfile scan
      run: |
        go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.1
        "$HOME/go/bin/osv-scanner" scan source --config=osv-scanner.toml --lockfile=package-lock.json --format=json --output=work/security/osv.json
    - run: node scripts/check-licenses.mjs work/security/sbom.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: supply-chain-evidence
        path: work/security/
  policy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - run: npm ci --ignore-scripts
    - run: node scripts/check-workflow-security.mjs && node scripts/check-public-safety.cjs
