name: Deploy V3 site and app to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Fetch WOL meeting weeks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: node --test scripts/meetings/parse.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check:bundle && node scripts/check-v3-resume.cjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/check-refinement.cjs && node scripts/check-ap-refinement.cjs && node scripts/overlay-audit.ts && node scripts/check-short-navigation.cjs && node scripts/check-refinement-pdf.mjs && node scripts/check-oclm-print.cjs
      - run: node scripts/check-direct-downloads.cjs && node scripts/check-home-next.cjs && node scripts/check-weekend-next.cjs && node scripts/check-install-next.cjs && node scripts/check-theme-fonts.cjs && node scripts/check-wol-app.cjs && node scripts/check-marketing-site.cjs
      - run: node scripts/contrast-check.mjs && node scripts/check-rendered-contrast.mjs && node scripts/check-claims.mjs
      - run: node scripts/check-v3-store-browser.mjs && node scripts/check-v3-offline-app.cjs
      - run: node scripts/build-pages.mjs
        env:
          CA_PAGES_URL: ${{ vars.CUSTOM_DOMAIN_READY == 'true' && (vars.SITE_URL || 'https://congregationassistant.com') || 'https://photographicode.github.io/congregation-assistant' }}
          CUSTOM_DOMAIN_READY: ${{ vars.CUSTOM_DOMAIN_READY || 'false' }}
          SITE_URL: ${{ vars.SITE_URL || '' }}
          APP_URL: ${{ vars.APP_URL || '' }}
      - run: node scripts/check-s89-contract.mjs
      - name: Require completed product parity before publishing
        run: npm run check:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages
  refinement:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        fontMode: [css, browser-default]
    env:
      CA_REFINEMENT_FONT_MODE: ${{ matrix.fontMode }}
      CA_REFINEMENT_SCALES: ${{ matrix.fontMode == 'browser-default' && '1,1.25,1.5,2' || '1,1.3,2' }}
      CA_REFINEMENT_LANDSCAPE: 'true'
      CA_REFINEMENT_SHARD: ${{ matrix.shard }}
      CA_REFINEMENT_REPORT: docs/qa/refinement-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/refinement-matrix.ts
      - run: node scripts/refinement-matrix.ts
        env:
          CA_REFINEMENT_SCREENS: publisher-entry,group-entry,public-entry,public-error,public-pending,owner-editor,owner-request,public-schedule,public-schedule-aux
          CA_REFINEMENT_REPORT: docs/qa/refinement-role-matrix-${{ matrix.fontMode }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-geometry-${{ matrix.fontMode }}-${{ matrix.shard }}
          path: docs/qa/refinement-*matrix*.json
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, refinement]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use Actions as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...context.repo,
                build_type: 'workflow'
              });
              core.info('Pages uses Actions; branch publishing is disabled.');
            } catch (error) {
              if (error.status !== 403) throw error;
              core.warning('This token cannot change the Pages publishing source. Select GitHub Actions in repository Pages settings to avoid competing branch builds.');
            }
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify published site app worker and on-device demo
        run: node scripts/check-pages-deploy.cjs
        env:
          CA_LIVE_URL: https://photographicode.github.io/congregation-assistant/
          CA_EXPECTED_COMMIT: ${{ github.sha }}
