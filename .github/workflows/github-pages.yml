name: Deploy V3 site and app to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Fetch WOL meeting weeks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: node --test scripts/meetings/parse.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build && node scripts/check-v3-resume.cjs
      - run: node scripts/check-direct-downloads.cjs && node scripts/check-home-next.cjs && node scripts/check-weekend-next.cjs && node scripts/check-install-next.cjs && node scripts/check-theme-fonts.cjs && node scripts/check-wol-app.cjs && node scripts/check-marketing-site.cjs
      - run: node scripts/contrast-check.mjs && node scripts/check-rendered-contrast.mjs && node scripts/check-claims.mjs
      - run: node scripts/check-v3-store-browser.mjs && node scripts/check-v3-offline-app.cjs
      - run: node scripts/build-pages.mjs
        env:
          CA_PAGES_URL: https://photographicode.github.io/congregation-assistant
      - run: node scripts/check-s89-contract.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify published site app worker and on-device demo
        run: node scripts/check-pages-deploy.cjs
        env:
          CA_LIVE_URL: https://photographicode.github.io/congregation-assistant/
          CA_EXPECTED_COMMIT: ${{ github.sha }}
