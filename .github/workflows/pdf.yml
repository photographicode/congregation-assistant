name: Native PDF golden and script contracts
permissions:
  contents: read
concurrency:
  group: pdf-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pil python3-numpy python3-fitz
    - run: node scripts/generate-v2-pdf-fixtures.mjs
    - run: node scripts/generate-s21-hardening.mjs
    - run: python3 scripts/check-s21-measured.py
    - run: node scripts/pdf-geometry.ts work/pdf-s21-hardening
      env:
        CA_PDF_GEOMETRY_REPORT: docs/qa/s21-hardening-geometry.json
    - run: node scripts/check-r1-pdf-semantic.mjs
    - run: node scripts/pdf-vs-v1.mjs
    - run: npx vitest run tests/v3/pdf-property.test.ts
    - run: python3 scripts/check-r1-pdf-parity.py
    - run: node scripts/generate-r1-pdf-fixtures.mjs
    - run: node scripts/check-s89-contract.mjs
    - run: node scripts/check-refinement-pdf.mjs
    - run: node scripts/pdf-geometry.ts work/pdf-v2 work/s89-fixtures work/refinement-pdf work/pdf-r1-stress
    - run: node scripts/check-pdf-contract.mjs
    - run: node scripts/check-unicode-native-pdf.mjs
    - run: node scripts/check-schedule-pdf.mjs
    - run: npm run build
    - run: npx playwright install --with-deps chromium
      timeout-minutes: 6
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
    - run: node scripts/check-pdf-browser.cjs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-pdf-evidence
        path: 'docs/review-evidence/pdf-*.json

          docs/qa/r1-pdf*.json

          docs/qa/s21-*.json

          tests/pdf-geometry/

          work/pdf-v2/

          work/pdf-unicode/

          '
        retention-days: 14
        overwrite: true
'on':
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
