name: Application acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-cloud-readiness.cjs
      - run: curl --fail --max-time 20 https://supabase.com/changelog.md -o artifacts/cloud/supabase-changelog.md
      - run: curl --fail --max-time 20 https://supabase.com/changelog/postgres-15-19-17-11-breaking-changes -o artifacts/cloud/postgres-17-11-changes.html
      - run: curl --fail --max-time 20 https://supabase.com/changelog/45329-breaking-change-tables-not-exposed-to-data-and-graphql-api-automatically -o artifacts/cloud/data-api-changes.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-readiness
          path: artifacts/cloud/
          retention-days: 14
  browser-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run build:styles && git diff --exit-code -- app-utilities.css
      - run: npm test
        env:
          CA_CHECK_OUTPUT: artifacts/pdf-check
      - run: node scripts/check-noticeboard-view.cjs
      - run: node scripts/check-pdf-offline.cjs
      - run: node scripts/check-install-guidance.cjs
      - run: node scripts/check-unicode-pdf.cjs
      - run: python3 scripts/check-pdf-layout.py artifacts/pdf-check --render
      - run: python3 scripts/check-s21-alignment.py artifacts/pdf-check/s21.pdf
      - run: python3 scripts/check-s21-alignment.py artifacts/pdf-check/s21-zeros.pdf
      - run: node scripts/check-scheduling-simplicity.cjs
      - run: node scripts/check-departments.cjs
      - run: node scripts/check-noticeboard.cjs
      - run: node scripts/check-publisher-portal.cjs
      - run: node scripts/check-showcase.cjs
      - run: node scripts/check-import-recovery.cjs
      - run: npm run test:browser
      - run: node public-site-preview/scripts/check-site.cjs
        env:
          CA_SITE_OUTPUT: artifacts/public-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: artifacts/
          retention-days: 14
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: ca_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h localhost -U postgres -d ca_acceptance -f scripts/check-supabase.sql
        env:
          PGPASSWORD: acceptance-only
      - name: Restore an isolated synthetic database backup
        run: |
          createdb -h localhost -U postgres ca_restore_check
          docker exec -e PGPASSWORD=acceptance-only "${{ job.services.postgres.id }}" pg_dump -U postgres --no-owner ca_acceptance > /tmp/ca-synthetic-backup.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d ca_restore_check -f /tmp/ca-synthetic-backup.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d ca_restore_check -f scripts/check-restored-backup.sql
        env:
          PGPASSWORD: acceptance-only

  accessibility-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/audit-accessibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-matrix
          path: artifacts/accessibility/
          retention-days: 14
