name: Application acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm test
        env:
          CA_CHECK_OUTPUT: artifacts/pdf-check
      - run: python3 scripts/check-pdf-layout.py artifacts/pdf-check --render
      - run: npm run test:browser
      - run: node scripts/check-cloud-readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: artifacts/
          retention-days: 14
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: ca_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h localhost -U postgres -d ca_acceptance -f scripts/check-supabase.sql
        env:
          PGPASSWORD: acceptance-only
