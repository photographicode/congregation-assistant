name: Published website verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-site-published.cjs
        env:
          CA_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://congregationassistant.com/' }}
