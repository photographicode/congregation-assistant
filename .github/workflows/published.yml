name: Published website verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-website
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CA_CHECK_BASE_URL: https://photographicode.github.io/congregation-assistant/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-published.cjs
      - run: npm run test:browser
      - run: node public-site-preview/scripts/check-site.cjs
        env:
          CA_SITE_OUTPUT: artifacts/public-site
          CA_SITE_URL: https://photographicode.github.io/congregation-assistant/public-site-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-website-results
          path: artifacts/
          retention-days: 14
