name: Google provider readiness
on:
  push:
    paths:
      - .github/workflows/google-readiness.yml
      - scripts/check-google-readiness.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-google-readiness.cjs
